apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: orch-109920256
  labels:
    app: nginx-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
        - name: nginx-container
          image: # insert nginx docker registry image
          ports:
            - containerPort: 80
