server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://main-server-service:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /dashboard {
    return 301 /dashboard/;
  }

  location /dashboard/ {
    proxy_pass https://kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local:443/;
    
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_ssl_name kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local;
    proxy_ssl_session_reuse on;

    proxy_set_header Host kubernetes-dashboard.kubernetes-dashboard.svc.cluster.local;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
