name: ${COMPOSE_PROJECT_NAME:-clo835-project}

services:
  nginx-dev:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-dev/nginx.conf:/etc/nginx/conf.d/default.conf

  client:
    image: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/client:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/client/Dockerfile
      target: build
    command: yarn workspace @clo835-project/client dev
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://main-server:3000}
    ports:
      - "${CLIENT_HOST_PORT:-5173}:5173"
    volumes:
      - ../packages/client/src:/app/packages/client/src
      - ../packages/client/index.html:/app/packages/client/index.html
      - ../packages/client/vite.config.ts:/app/packages/client/vite.config.ts
      - ../packages/shared/src:/app/packages/shared/src

  main-server:
    image: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/main-server:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/main-server/Dockerfile
      target: build
    command: yarn workspace @clo835-project/main-server dev
    env_file:
      - ../.env
    ports:
      - "${MAIN_SERVER_PORT:-3000}:${MAIN_SERVER_PORT:-3000}"
    volumes:
      - ../packages/main-server/src:/app/packages/main-server/src
      - ../packages/shared/src:/app/packages/shared/src
    depends_on:
      redis:
        condition: service_healthy

  task-orchestrator:
    image: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/task-orchestrator:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/task-orchestrator/Dockerfile
      target: build
    command: yarn workspace @clo835-project/task-orchestrator dev
    env_file:
      - ../.env
    environment:
      EPHEMERAL_WORKER_IMAGE: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/ephemeral-worker:${IMAGE_TAG:-local}
      LOCAL_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-clo835-project}_default
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    ports:
      - "${TASK_ORCHESTRATOR_PORT:-3001}:${TASK_ORCHESTRATOR_PORT:-3001}"
    volumes:
      - ../packages/task-orchestrator/src:/app/packages/task-orchestrator/src
      - ../packages/shared/src:/app/packages/shared/src
      - ${DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  bullmq-worker:
    image: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/bullmq-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/bullmq-worker/Dockerfile
      target: build
    command: yarn workspace @clo835-project/bullmq-worker dev
    env_file:
      - ../.env
    volumes:
      - ../packages/bullmq-worker/src:/app/packages/bullmq-worker/src
      - ../packages/shared/src:/app/packages/shared/src
    depends_on:
      redis:
        condition: service_healthy

  ephemeral-worker:
    image: ${IMAGE_REPOSITORY_PREFIX:-clo835-project}/ephemeral-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/ephemeral-worker/Dockerfile
    command: python src/main.py
    profiles:
      - manual
    env_file:
      - ../.env
    volumes:
      - ../packages/ephemeral-worker/src:/app/packages/ephemeral-worker/src
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
